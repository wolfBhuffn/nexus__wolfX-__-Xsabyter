<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOLFx_xSABYTER_V2 // COMMAND CENTER</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 2px; color: var(--text-main); }
        .status-badge { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--success); font-weight: 600; }
        .pulse { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); animation: blink 2s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .card-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px; font-weight: 600; }

        .input-group { display: flex; flex-direction: column; gap: 10px; }
        select, textarea, input, button { background: #1f2937; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 6px; font-size: 0.95rem; outline: none; }
        textarea { resize: vertical; min-height: 80px; }
        button { background: var(--accent-color); font-weight: 600; border: none; cursor: pointer; transition: background 0.2s; letter-spacing: 1px; }
        button:hover { background: var(--accent-hover); }

        .grid-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .quick-btn { background: #1f2937; border: 1px solid var(--border-color); font-size: 0.85rem; text-align: center; }

        #responseLog { background: #000; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.8rem; color: var(--text-dim); max-height: 200px; overflow-y: auto; white-space: pre-wrap; }
        .nav-footer { text-align: center; margin-top: 20px; }
        .nav-footer a { color: var(--text-dim); font-size: 0.8rem; text-decoration: none; }
        .nav-footer a:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <h1>WOLFx_xSABYTER_V2</h1>
        <div class="status-badge">
            <div class="pulse"></div> ACTIVE NODE
        </div>
    </header>

    <!-- QUICK DISPATCH CARD -->
    <div class="card">
        <div class="card-title">Dispatch & Note Engine</div>
        <div class="input-group">
            <select id="categorySelect">
                <option value="idea">💡 Idea / Concept</option>
                <option value="trade">📈 Trading Setup / P&L</option>
                <option value="content">🐺 Wolf SaByter Content</option>
                <option value="task">⚡ Action Item / Task</option>
            </select>
            <textarea id="logInput" placeholder="Enter dispatch content..."></textarea>
            <button onclick="transmitLog()">Transmit Payload</button>
        </div>
    </div>

    <!-- SYSTEM MONITOR -->
    <div class="card">
        <div class="card-title">Node Diagnostics</div>
        <div class="grid-buttons">
            <button class="quick-btn" onclick="checkStatus()">Check Git Status</button>
            <button class="quick-btn" onclick="clearConsole()">Clear Console</button>
        </div>
    </div>

    <!-- CONSOLE OUTPUT -->
    <div class="card">
        <div class="card-title">Console Output</div>
        <div id="responseLog">WOLFx_xSABYTER_V2 Command Center online... Ready for input.</div>
    </div>

    <div class="nav-footer">
        <a href="login.html">🔒 Lock Session / Return to Portal</a>
    </div>

    <script>
        function transmitLog() {
            const category = document.getElementById('categorySelect').value;
            const content = document.getElementById('logInput').value;
            const logBox = document.getElementById('responseLog');

            if (!content.trim()) {
                logBox.innerText = "[!] Error: Dispatch payload cannot be empty.";
                return;
            }

            const timestamp = new Date().toISOString();
            logBox.innerText = `[${timestamp}] Transmitting [${category.toUpperCase()}] payload...\n> "${content}"\n[SUCCESS] Payload logged locally. Ready for git sync.`;
            document.getElementById('logInput').value = '';
        }

        function checkStatus() {
            const logBox = document.getElementById('responseLog');
            logBox.innerText = "[*] Node Status: ONLINE\n[+] Branch: main\n[+] Workspace: Clean\n[+] Security: Authenticated via Passkey Gate";
        }

        function clearConsole() {
            document.getElementById('responseLog').innerText = "Console cleared.";
        }
    </script>
</body>
</html>
