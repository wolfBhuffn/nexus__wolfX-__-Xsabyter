<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // COMMAND CENTER</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; color: var(--text-main); }
        .status-badge { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--success); font-weight: 600; }
        .pulse { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 8px var(--success); animation: blink 2s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .card-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 12px; font-weight: 600; }

        .input-group { display: flex; flex-direction: column; gap: 10px; }
        select, textarea, input, button { background: #1f2937; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 6px; font-size: 0.95rem; }
        textarea { resize: vertical; min-height: 70px; }
        button { background: var(--accent-color); font-weight: 600; border: none; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }

        .grid-inputs-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-inputs-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .grid-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .quick-btn { background: #1f2937; border: 1px solid var(--border-color); font-size: 0.85rem; text-align: center; }

        #responseLog { background: #000; border: 1px solid var(--border-color); border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.8rem; color: var(--text-dim); max-height: 300px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

    <header>
        <h1>NEXUS // HQ</h1>
        <div class="status-badge">
            <div class="pulse"></div> LIVE
        </div>
    </header>

    <!-- AUTONOMOUS TRADING AGENT & LEDGER -->
    <div class="card">
        <div class="card-title">🤖 Autonomous Trading Agent & Ledger</div>
        <div class="input-group">
            <div class="grid-inputs-3">
                <div>
                    <label style="font-size: 0.75rem; color: var(--text-dim);">Symbol</label>
                    <select id="tradeSymbol">
                        <option value="NQ">NQ (Nasdaq)</option>
                        <option value="ES">ES (S&P 500)</option>
                        <option value="MNQ">MNQ (Micro)</option>
                        <option value="MES">MES (Micro)</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: var(--text-dim);">Contracts</label>
                    <input type="number" id="tradeContracts" placeholder="1" value="1" min="1">
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: var(--text-dim);">P&L ($)</label>
                    <input type="number" id="tradePnl" placeholder="250.00" step="0.01">
                </div>
            </div>
            <textarea id="tradeNotes" placeholder="Setup notes (e.g. FVG entry, session high sweep)..."></textarea>
            <div class="grid-buttons">
                <button onclick="logTrade()">Manual P&L Entry</button>
                <button onclick="testWebhookSignal()" style="background: var(--warning); color: #000;">Test Auto-Signal</button>
            </div>
        </div>
    </div>

    <!-- WOLF SABYTER CONTENT ENGINE -->
    <div class="card">
        <div class="card-title">🐺 Wolf SaByter Content Engine</div>
        <div class="grid-buttons">
            <button class="quick-btn" onclick="generateContent()">Generate Staged Post</button>
            <button class="quick-btn" onclick="approveContent()">Approve & Commit</button>
        </div>
    </div>

    <!-- BIWEEKLY PAYROLL & VAULT CALCULATOR -->
    <div class="card">
        <div class="card-title">Biweekly Payroll & Vault Engine ($20/hr)</div>
        <div class="input-group">
            <div class="grid-inputs-2">
                <div>
                    <label style="font-size: 0.75rem; color: var(--text-dim);">Reg Hours</label>
                    <input type="number" id="regHoursInput" placeholder="80" value="80" step="0.5">
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: var(--text-dim);">OT Hours</label>
                    <input type="number" id="otHoursInput" placeholder="0" value="0" step="0.5">
                </div>
            </div>
            <button onclick="calculatePayroll()">Calculate & Allocate Pay</button>
        </div>
    </div>

    <!-- LOGGING PANEL -->
    <div class="card">
        <div class="card-title">Quick Entry Dispatch</div>
        <div class="input-group">
            <select id="categorySelect">
                <option value="idea">💡 Idea / Note</option>
                <option value="trade">📈 Trading / P&L Setup</option>
                <option value="content">🐺 Wolf SaByter Content</option>
                <option value="task">⚡ Task / Action Item</option>
            </select>
            <textarea id="logInput" placeholder="Enter dispatch content..."></textarea>
            <button onclick="submitLog()">Transmit to GitHub</button>
        </div>
    </div>

    <!-- SYSTEM MONITOR -->
    <div class="card">
        <div class="card-title">System Diagnostics</div>
        <div class="grid-buttons">
            <button class="quick-btn" onclick="checkStatus()">Check Engine Status</button>
            <button class="quick-btn" onclick="clearTerminal()">Clear Console</button>
        </div>
    </div>

    <!-- TERMINAL OUTPUT -->
    <div class="card">
        <div class="card-title">Console Output</div>
        <div id="responseLog">NEXUS Command Center initialized... Ready for input.</div>
    </div>

    <script>
        let currentStagedContent = null;

        async function testWebhookSignal() {
            const logBox = document.getElementById('responseLog');
            logBox.innerText = "[...] Incoming TradingView signal detected... Sending to NEXUS Agent...";

            const mockSignal = {
                symbol: document.getElementById('tradeSymbol').value || "NQ",
                action: "BUY",
                contracts: parseInt(document.getElementById('tradeContracts').value) || 1,
                price: 18250.25,
                stop_loss: 18220.00,
                take_profit: 18310.00,
                source: "TradingView_ICT_FVG_Webhook"
            };

            try {
                const res = await fetch('/api/webhook/trade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(mockSignal)
                });
                const responseData = await res.json();
                
                if (responseData.status === 'processed') {
                    const r = responseData.result;
                    let output = `=== TRADING AGENT SIGNAL EVALUATION ===\n`;
                    output += `Status: ${r.status}\n`;
                    if (r.status === 'EXECUTED') {
                        const d = r.details;
                        output += `Action: ${d.action} ${d.contracts} ${d.symbol} @ $${d.entry_price}\n`;
                        output += `Stop Loss: $${d.stop_loss} | Take Profit: $${d.take_profit}\n`;
                        output += `Broker Target: ${d.broker}\n`;
                        output += `[SUCCESS] Signal verified & trade record committed to GitHub!`;
                    } else {
                        output += `Reason: ${r.reason}\n`;
                    }
                    logBox.innerText = output;
                }
            } catch (err) {
                logBox.innerText = `[ERROR] Webhook execution failed: ${err}`;
            }
        }

        async function logTrade() {
            const symbol = document.getElementById('tradeSymbol').value;
            const contracts = document.getElementById('tradeContracts').value || 1;
            const pnl = document.getElementById('tradePnl').value;
            const notes = document.getElementById('tradeNotes').value;
            const logBox = document.getElementById('responseLog');

            if (pnl === '') {
                logBox.innerText = "[!] Please enter a P&L amount.";
                return;
            }

            logBox.innerText = "[...] Logging futures trade to GitHub ledger...";

            try {
                const res = await fetch('/api/trade', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol, contracts, pnl, notes })
                });
                const responseData = await res.json();

                if (responseData.status === 'success') {
                    const t = responseData.data;
                    let output = `=== FUTURES TRADE LOGGED ===\n`;
                    output += `Symbol: ${t.symbol} (${t.contracts} contracts)\n`;
                    output += `P&L: ${t.pnl >= 0 ? '+' : ''}$${t.pnl.toFixed(2)} [${t.status}]\n`;
                    output += `Notes: ${t.notes || 'None'}\n\n`;
                    output += `[SUCCESS] Trade committed to GitHub ledger!`;

                    logBox.innerText = output;
                    document.getElementById('tradePnl').value = '';
                    document.getElementById('tradeNotes').value = '';
                } else {
                    logBox.innerText = `[ERROR] ${responseData.message}`;
                }
            } catch (err) {
                logBox.innerText = `[ERROR] Failed to log trade: ${err}`;
            }
        }

        async function generateContent() {
            const logBox = document.getElementById('responseLog');
            logBox.innerText = "[...] Multi-platform content agent generating staged payload...";

            try {
                const res = await fetch('/api/content');
                const data = await res.json();
                
                if (data.status === 'success') {
                    currentStagedContent = data.data;
                    const p = currentStagedContent.platforms;

                    let output = `=== WOLF SABYTER MULTI-PLATFORM MATRIX ===\n`;
                    output += `Theme: ${currentStagedContent.theme}\n`;
                    output += `Pillar: ${currentStagedContent.pillar}\n\n`;

                    output += `📸 INSTAGRAM (Carousel & Caption):\n`;
                    p.instagram.carousel_slides.forEach(s => output += `  • ${s}\n`);
                    output += `  Caption: ${p.instagram.caption}\n\n`;

                    output += `🎬 YOUTUBE SHORTS:\n`;
                    output += `  Hook: "${p.youtube_shorts.hook_spoken}"\n`;
                    output += `  Pinned: ${p.youtube_shorts.pinned_comment}\n\n`;

                    output += `🧵 X / TWITTER THREAD:\n`;
                    p.x_twitter.thread.forEach(t => output += `  • ${t}\n`);

                    output += `\n🛒 TIKTOK SHOP:\n`;
                    output += `  Script: ${p.tiktok_shop.script}\n`;
                    output += `  CTA: ${p.tiktok_shop.cta}\n\n`;

                    output += `💼 LINKEDIN:\n`;
                    output += `  Headline: ${p.linkedin.headline}\n`;

                    output += `\n[ACTION] Click 'Approve & Commit' to queue all platforms to GitHub.`;

                    logBox.innerText = output;
                } else {
                    logBox.innerText = `[ERROR] Could not generate multi-platform payload.`;
                }
            } catch (err) {
                logBox.innerText = `[ERROR] Content agent failed: ${err}`;
            }
        }

        async function approveContent() {
            const logBox = document.getElementById('responseLog');
            if (!currentStagedContent) {
                logBox.innerText = "[!] Please generate content before approving.";
                return;
            }

            logBox.innerText = "[...] Committing approved multi-platform payload to GitHub queue...";

            try {
                const res = await fetch('/api/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        category: 'WOLF_SABYTER_CONTENT', 
                        content: JSON.dumps(currentStagedContent) 
                    })
                });
                const data = await res.json();
                logBox.innerText = `[SUCCESS] Approved multi-platform payload committed to GitHub!`;
                currentStagedContent = null;
            } catch (err) {
                logBox.innerText = `[ERROR] Failed to commit content: ${err}`;
            }
        }

        async function calculatePayroll() {
            const regHours = document.getElementById('regHoursInput').value || 0;
            const otHours = document.getElementById('otHoursInput').value || 0;
            const logBox = document.getElementById('responseLog');

            logBox.innerText = "[...] Calculating biweekly earnings & running vault distribution...";

            try {
                const res = await fetch('/api/payroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        reg_hours: regHours, 
                        ot_hours: otHours, 
                        rate: 20.00 
                    })
                });
                const responseData = await res.json();
                
                if (responseData.status === 'success') {
                    const d = responseData.data;
                    const v = d.vault_distribution;
                    
                    let output = `=== BIWEEKLY PAYROLL BREAKDOWN ===\n`;
                    output += `Regular Hours: ${d.regular_hours} hrs @ $${d.base_rate}/hr\n`;
                    output += `Overtime Hours: ${d.ot_hours} hrs @ $${d.ot_rate}/hr (1.5x)\n`;
                    output += `-----------------------------------\n`;
                    output += `Gross Earnings: $${d.gross_pay}\n`;
                    output += `Estimated Net (Est. 22% Tax): $${d.estimated_net}\n\n`;
                    output += `--- VAULT ALLOCATIONS ---\n`;
                    output += `🏠 Household & Bills (40%): $${v.household_bills}\n`;
                    output += `🏎️ Subaru STI & GEICO (20%): $${v.subaru_and_auto}\n`;
                    output += `👶 Children's Growth (15%): $${v.kids_growth} ($${(v.kids_growth/2).toFixed(2)} each)\n`;
                    output += `🏡 Tri-State Home Fund (15%): $${v.tristate_home}\n`;
                    output += `📈 Trading Capital Reserve (10%): $${v.trading_reserve}\n\n`;
                    output += `[SUCCESS] Payroll record committed to GitHub logs.`;

                    logBox.innerText = output;
                } else {
                    logBox.innerText = `[ERROR] ${responseData.message}`;
                }
            } catch (err) {
                logBox.innerText = `[ERROR] Failed to calculate payroll: ${err}`;
            }
        }

        async function submitLog() {
            const category = document.getElementById('categorySelect').value;
            const content = document.getElementById('logInput').value;
            const logBox = document.getElementById('responseLog');

            if (!content) {
                logBox.innerText = "[!] Please enter content before dispatching.";
                return;
            }

            logBox.innerText = "[...] Transmitting payload to GitHub API...";

            try {
                const res = await fetch('/api/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category, content })
                });
                const data = await res.json();
                logBox.innerText = `[SUCCESS] ${data.message}`;
                document.getElementById('logInput').value = '';
            } catch (err) {
                logBox.innerText = `[ERROR] Failed to send dispatch: ${err}`;
            }
        }

        async function checkStatus() {
            const logBox = document.getElementById('responseLog');
            logBox.innerText = "[...] Fetching NEXUS diagnostics...";
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                logBox.innerText = data.output || "No output returned.";
            } catch (err) {
                logBox.innerText = `[ERROR] Failed to fetch status: ${err}`;
            }
        }

        function clearTerminal() {
            document.getElementById('responseLog').innerText = "Console cleared.";
        }
    </script>
</body>
</html>
